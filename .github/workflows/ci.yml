name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (derle + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore api/Nabiz.slnx
      - run: dotnet build api/Nabiz.slnx --no-restore -c Release
      - run: dotnet test api/Nabiz.Tests --no-build -c Release --logger "trx;LogFileName=test.trx"

  web:
    name: Web (derle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  docker:
    name: Docker imajları
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nabiz-api ./api
      - run: docker build -t nabiz-web ./web
