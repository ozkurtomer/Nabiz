name: Demo sayfası

# Yalnızca elle çalışır. Pages açık olduğunda (repo public ya da ücretli plan)
# Actions sekmesinden "Run workflow" ile yayınla; otomatik yayın için push tetikleyicisini geri ekle.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dagit
        uses: actions/deploy-pages@v4
