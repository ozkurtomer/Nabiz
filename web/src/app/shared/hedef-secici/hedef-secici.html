<div class="sekmeler">
  <button type="button" [class.aktif]="tip() === 'Hepsi'" (click)="tipSec('Hepsi')"><app-ikon ad="users" /> {{ 'Herkes' | t }}</button>
  <button type="button" [class.aktif]="tip() === 'Departman'" (click)="tipSec('Departman')"><app-ikon ad="building" /> {{ 'Departman' | t }}</button>
  <button type="button" [class.aktif]="tip() === 'Kisi'" (click)="tipSec('Kisi')"><app-ikon ad="user" /> {{ 'Kişi seç' | t }}</button>
</div>

@if (tip() === 'Departman') {
  <select [ngModel]="deger()" (ngModelChange)="deger.set($event)" class="tam">
    @for (d of departmanlar(); track d) { <option [value]="d">{{ d }}</option> }
  </select>
}

@if (tip() === 'Kisi') {
  <div class="kisi-kutu">
    <div class="kisi-ust">
      <input [ngModel]="ara()" (ngModelChange)="ara.set($event)" [placeholder]="'Ad veya departman ara…' | t">
      <button type="button" class="kucuk" (click)="hepsiniSec()">{{ 'Görünenleri seç' | t }}</button>
      <button type="button" class="kucuk hayalet" (click)="temizle()">{{ 'Temizle' | t }}</button>
    </div>
    <div class="liste">
      @for (k of filtreli(); track k.id) {
        <label class="satir">
          <input type="checkbox" [checked]="secili().has(k.id)" (change)="kisiDegistir(k.id, $any($event.target).checked)">
          <span class="ad">{{ k.ad }}</span><small>{{ k.departman || '—' }}</small>
        </label>
      } @empty { <p class="bos">{{ 'Eşleşen kişi yok.' | t }}</p> }
    </div>
  </div>
}

<p class="ozet"><app-ikon ad="mail" /> {{ 'Hedef:' | t }} <b>{{ hedefSayisi() }}</b> {{ 'kişi' | t }}</p>
