<div class="sekmeler">
  <button type="button" [class.aktif]="tip() === 'Hepsi'" (click)="tipSec('Hepsi')">👥 Herkes</button>
  <button type="button" [class.aktif]="tip() === 'Departman'" (click)="tipSec('Departman')">🏢 Departman</button>
  <button type="button" [class.aktif]="tip() === 'Kisi'" (click)="tipSec('Kisi')">🙋 Kişi seç</button>
</div>

@if (tip() === 'Departman') {
  <select [ngModel]="deger()" (ngModelChange)="deger.set($event)" class="tam">
    @for (d of departmanlar(); track d) { <option [value]="d">{{ d }}</option> }
  </select>
}

@if (tip() === 'Kisi') {
  <div class="kisi-kutu">
    <div class="kisi-ust">
      <input [ngModel]="ara()" (ngModelChange)="ara.set($event)" placeholder="Ad veya departman ara…">
      <button type="button" class="kucuk" (click)="hepsiniSec()">Görünenleri seç</button>
      <button type="button" class="kucuk hayalet" (click)="temizle()">Temizle</button>
    </div>
    <div class="liste">
      @for (k of filtreli(); track k.id) {
        <label class="satir">
          <input type="checkbox" [checked]="secili().has(k.id)" (change)="kisiDegistir(k.id, $any($event.target).checked)">
          <span class="ad">{{ k.ad }}</span><small>{{ k.departman || '—' }}</small>
        </label>
      } @empty { <p class="bos">Eşleşen kişi yok.</p> }
    </div>
  </div>
}

<p class="ozet">📨 Hedef: <b>{{ hedefSayisi() }}</b> kişi</p>
